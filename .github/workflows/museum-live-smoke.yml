name: Museum live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/museum-live-smoke.yml'
      - 'components/views/LoginView.tsx'
      - 'hooks/useAuth.ts'
      - 'services/supabase/auth.ts'
      - 'services/supabase/client.ts'
      - 'App.tsx'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/museum-smoke"
          cd "$RUNNER_TEMP/museum-smoke"
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test@1.56.1
          npx playwright install --with-deps chromium

      - name: Run live browser smoke
        working-directory: ${{ runner.temp }}/museum-smoke
        run: |
          cat > museum.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');

          test('CheckList museum is reachable and live authentication endpoint responds safely', async ({ page }) => {
            const base = 'https://mechanicalh600-lang.github.io/CheckList/';
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));

            const response = await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 30000 });
            expect(response && response.ok()).toBeTruthy();
            await expect(page.getByText('ورود به حساب کاربری')).toBeVisible({ timeout: 15000 });
            await expect(page.getByText('نسخه 3.0.0')).toBeVisible();

            const loginRpc = page.waitForResponse(
              (r) => r.url().includes('/rest/v1/rpc/museum_login'),
              { timeout: 20000 }
            );
            await page.getByPlaceholder('نام کاربری خود را وارد کنید').fill('__museum_invalid_user__');
            await page.locator('input[type="password"]').first().fill('invalid-password-for-smoke-test');
            await page.getByRole('button', { name: 'ورود به سیستم' }).click();
            const loginResponse = await loginRpc;
            expect(loginResponse.ok()).toBeTruthy();
            await expect(page.getByText('نام کاربری یا رمز عبور اشتباه است.')).toBeVisible({ timeout: 12000 });

            expect(pageErrors, `Browser page errors: ${pageErrors.join(' | ')}`).toEqual([]);
          });
          EOF

          npx playwright test museum.spec.cjs --reporter=line --workers=1
