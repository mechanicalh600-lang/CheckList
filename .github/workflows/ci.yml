name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [museum-hardening-phase2-20260909]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        env:
          VITE_BASE_PATH: /CheckList/
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
