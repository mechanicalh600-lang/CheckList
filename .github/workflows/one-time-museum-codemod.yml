name: One-time museum codemod

on:
  push:
    branches: [museum-hardening-20260908]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: museum-hardening-20260908
      - name: Repair missing historical icon import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/AdminDashboard.tsx')
          text = p.read_text()
          old = 'AlertCircle, CheckCircle, ShieldCheck'
          new = 'AlertCircle, CheckCircle, CheckCircle2, ShieldCheck'
          if old in text and 'CheckCircle, CheckCircle2, ShieldCheck' not in text:
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair if needed
        run: |
          if git diff --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AdminDashboard.tsx
          git commit -m "fix: restore missing CheckCircle2 import"
          git push origin HEAD:museum-hardening-20260908
