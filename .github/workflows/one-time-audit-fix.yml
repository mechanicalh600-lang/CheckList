name: One-time dependency repair

on:
  push:
    branches: [museum-hardening-20260908]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: museum-hardening-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply non-breaking npm security fixes
        run: npm audit fix
      - name: Validate typecheck
        run: npm run typecheck
      - name: Validate tests
        run: npm test
      - name: Validate production build
        env:
          VITE_BASE_PATH: /CheckList/
        run: npm run build
      - name: Commit dependency updates
        run: |
          if git diff --quiet; then
            echo "No dependency changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply conservative npm audit fixes"
          git push origin HEAD:museum-hardening-20260908
